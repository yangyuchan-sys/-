<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANT DESK PRO : 글로벌 매크로 펀드매니저 시뮬레이터</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #060913;
            --bg-panel: #0d1323;
            --bg-card: #131c31;
            --border-color: #1e2d4a;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-gold: #fbbf24;
        }

        body {
            background-color: var(--bg-main);
            color: #e2e8f0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* 상단 네온 글래스 헤더 */
        .top-navbar {
            background: rgba(13, 19, 35, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* 흐르는 뉴스 티커 */
        .ticker-bar {
            background: linear-gradient(90deg, #0f172a, #1e1b4b, #0f172a);
            border-bottom: 1px solid #2e1065;
            padding: 6px 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        .ticker-content {
            display: inline-block;
            animation: marquee 32s linear infinite;
            color: #fde047;
            font-weight: 500;
        }
        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* 트레이딩 패널 카드 */
        .desk-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .kpi-box {
            background: linear-gradient(145deg, #131c31, #0b101d);
            border: 1px solid #233354;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.2s ease;
        }
        .kpi-box:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        /* 언론사 뉴스 카드 */
        .news-flash {
            background: linear-gradient(135deg, #172038 0%, #111827 100%);
            border-left: 4px solid var(--accent-blue);
            border-radius: 10px;
            padding: 15px;
            position: relative;
        }

        /* 자산 테이블 스타일 */
        .asset-table {
            font-size: 0.86rem;
            border-collapse: separate;
            border-spacing: 0 4px;
        }
        .asset-table tbody tr {
            background-color: var(--bg-card);
            transition: background 0.15s;
            cursor: pointer;
        }
        .asset-table tbody tr:hover {
            background-color: #1b2845;
        }
        .asset-table tbody tr.selected-row {
            outline: 1px solid var(--accent-blue);
            background-color: #172542;
        }
        .asset-table td, .asset-table th {
            border: none;
            padding: 10px 8px;
            vertical-align: middle;
        }

        /* 전략 스킬 카드 */
        .skill-btn {
            background: linear-gradient(145deg, #18223a, #101728);
            border: 1px solid #2b3d63;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
        }
        .skill-btn:hover:not(:disabled) {
            border-color: var(--accent-purple);
            background: #1e2a4a;
            transform: translateY(-1px);
        }
        .skill-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .up-text { color: #fb7185; font-weight: 700; }
        .down-text { color: #38bdf8; font-weight: 700; }
        .badge-sector { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; }
        
        .log-scroll {
            max-height: 165px;
            overflow-y: auto;
            font-size: 0.82rem;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #263656; border-radius: 3px; }
    </style>
</head>
<body>

<!-- 상단 네비게이션 바 -->
<div class="top-navbar d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div class="d-flex align-items-center gap-3">
        <span class="fs-4 fw-bold text-white"><i class="fa-solid fa-chart-line text-info me-2"></i>QUANT DESK <span class="text-info">PRO</span></span>
        <select id="scenario-select" class="form-select form-select-sm bg-dark text-warning border-secondary fw-semibold" style="width: auto;" onchange="changeScenario()">
            <option value="standard">🌐 표준 글로벌 사이클 (자유 모드)</option>
            <option value="crisis2008">📉
